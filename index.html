<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daily Wallpaper</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06101f">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<img id="wall" alt="Today's wallpaper">
<div id="shade"></div>
<header>
  <span id="net" class="pill">Checking…</span>
</header>
<main>
  <p id="date"></p>
  <h1 id="title"></h1>
  <div class="actions">
    <button id="save" class="primary">Save wallpaper</button>
    <button id="share">Share</button>
  </div>
  <div id="strip" aria-label="Previous wallpapers"></div>
</main>
<script src="app.js"></script><script src="gallery.js"></script>
</body>
</html>
